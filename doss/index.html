<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DOSS OS</title>
  <meta name="theme-color" content="#1877f2">
  <link rel="icon" href="/assets/icons/metaimperiya.ico" sizes="any">
  <style>
    :root{--bg:#f0f2f5;--card:#fff;--text:#1c1e21;--muted:#65676b;--border:#e4e6eb;--field:#f0f2f5;--accent:#1877f2;--danger:#e74c3c;--ok:#27ae60} [data-theme=dark]{--bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--border:#3a3b3c;--field:#3a3b3c;--accent:#2d88ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template:56px 1fr/240px 1fr;grid-template-areas:"top top" "nav main"}.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border)}.brand{font-weight:800}.nav{grid-area:nav;padding:10px 8px;background:var(--card);border-right:1px solid var(--border)}.nav button{display:block;width:100%;border:0;border-radius:8px;padding:10px;text-align:left;background:transparent;color:var(--text);cursor:pointer}.nav button:hover,.nav button.active{background:var(--accent);color:#fff}.main{grid-area:main;padding:20px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}.label,.small{color:var(--muted);font-size:.8em}.value{font-size:1.55em;font-weight:700;margin-top:5px}.row{display:flex;gap:8px;flex-wrap:wrap}.input,.select{flex:1;min-width:140px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--field);color:var(--text)}.btn{border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--card);color:var(--text);cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{background:var(--danger);color:#fff;border-color:var(--danger)}.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.item:last-child{border:0}.item>div{flex:1}.done{text-decoration:line-through;color:var(--muted)}.calc{max-width:420px}.display{background:var(--card);border:1px solid var(--border);padding:16px;border-radius:12px;text-align:right}.result{font-size:1.8em;font-weight:bold}.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.pad button{padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}.pad .equal{background:var(--accent);color:#fff}@media(max-width:700px){.app{grid-template:56px auto 1fr/1fr;grid-template-areas:"top" "nav" "main"}.nav{display:flex;overflow:auto;padding:6px;border-right:0;border-bottom:1px solid var(--border)}.nav button{white-space:nowrap;width:auto}.main{padding:12px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><span class="brand">🧠 DOSS OS</span><span><button class="btn" onclick="theme()">🌓</button> <a class="btn" href="/">← METAIMPERIYA</a></span></header>
  <nav class="nav"><button data-v="home">🏠 Dashboard</button><button data-v="tasks">✅ Tasks</button><button data-v="notes">📝 Notes</button><button data-v="diary">📔 Diary</button><button data-v="calendar">📅 Calendar</button><button data-v="contacts">👤 Contacts</button><button data-v="finance">💰 Finance</button><button data-v="bookmarks">🔖 Bookmarks</button><button data-v="calc">🧮 Calculator</button></nav>
  <main class="main">
    <section class="view" id="home"><h1>🧠 DOSS OS</h1><p class="small">Персональное рабочее пространство. Данные сохраняются в этом браузере.</p><div class="grid"><div class="card"><div class="label">Сегодня</div><div class="value" id="today"></div></div><div class="card"><div class="label">Незакрытые задачи</div><div class="value" id="countTasks">0</div></div><div class="card"><div class="label">Заметки</div><div class="value" id="countNotes">0</div></div><div class="card"><div class="label">Баланс</div><div class="value" id="balance">0</div></div></div></section>
    <section class="view" id="tasks"><h1>✅ Tasks</h1><div class="row"><input id="task" class="input" placeholder="Что нужно сделать?"><button class="btn primary" onclick="addTask()">Добавить</button></div><div class="card" id="tasksList"></div></section>
    <section class="view" id="notes"><h1>📝 Notes</h1><div class="row"><input id="note" class="input" placeholder="Текст заметки"><button class="btn primary" onclick="addNote()">Добавить</button></div><div class="card" id="notesList"></div></section>
    <section class="view" id="diary"><h1>📔 Diary</h1><div class="row"><select id="mood" class="select"><option>😄</option><option>🙂</option><option>😐</option><option>😔</option></select><input id="diaryText" class="input" placeholder="Что произошло сегодня?"><button class="btn primary" onclick="addDiary()">Добавить</button></div><div class="card" id="diaryList"></div></section>
    <section class="view" id="calendar"><h1>📅 Calendar</h1><div class="row"><input id="eventDate" class="input" type="date"><input id="eventTitle" class="input" placeholder="Событие"><button class="btn primary" onclick="addEvent()">Добавить</button></div><div class="card" id="eventsList"></div></section>
    <section class="view" id="contacts"><h1>👤 Contacts</h1><div class="row"><input id="contact" class="input" placeholder="Имя"><input id="phone" class="input" placeholder="Телефон"><button class="btn primary" onclick="addContact()">Добавить</button></div><div class="card" id="contactsList"></div></section>
    <section class="view" id="finance"><h1>💰 Finance</h1><div class="row"><select id="financeType" class="select"><option value="income">Доход</option><option value="expense">Расход</option></select><input id="amount" type="number" min="0" class="input" placeholder="Сумма"><input id="financeNote" class="input" placeholder="Комментарий"><button class="btn primary" onclick="addFinance()">Добавить</button></div><div class="card" id="financeList"></div></section>
    <section class="view" id="bookmarks"><h1>🔖 Bookmarks</h1><div class="row"><input id="bookmark" class="input" placeholder="Название"><input id="url" class="input" placeholder="https://..."><button class="btn primary" onclick="addBookmark()">Добавить</button></div><div class="card" id="bookmarksList"></div></section>
    <section class="view" id="calc"><h1>🧮 Calculator</h1><div class="calc"><div class="display"><div class="small" id="expr">0</div><div class="result" id="result">0</div></div><div class="pad" id="pad"></div></div></section>
  </main>
</div>
<script>
/* Автономный DOSS: вход не требуется, а данные изолированы в localStorage данного браузера. */
var KEY='doss_os_v1',DB;try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}DB=DB||{tasks:[],notes:[],diary:[],events:[],contacts:[],finance:[],bookmarks:[],theme:'light'};function save(){localStorage.setItem(KEY,JSON.stringify(DB))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function remove(group,id){DB[group]=DB[group].filter(function(x){return x.id!==id});save();render()}function list(id,data,empty,fn){document.getElementById(id).innerHTML=data.length?data.map(fn).join(''):'<div class="small">'+empty+'</div>'}function render(){document.getElementById('today').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});document.getElementById('countTasks').textContent=DB.tasks.filter(function(x){return!x.done}).length;document.getElementById('countNotes').textContent=DB.notes.length;var bal=DB.finance.reduce(function(s,x){return s+(x.type==='income'?x.amount:-x.amount)},0);document.getElementById('balance').textContent=bal.toFixed(2);list('tasksList',DB.tasks,'Пока пусто.',function(x){return'<div class="item"><input type="checkbox" '+(x.done?'checked':'')+' onchange="toggleTask(\''+x.id+'\')"><div class="'+(x.done?'done':'')+'">'+esc(x.text)+'</div><button class="btn danger" onclick="remove(\'tasks\',\''+x.id+'\')">✕</button></div>'});list('notesList',DB.notes,'Заметок нет.',function(x){return'<div class="item"><div>'+esc(x.text)+'</div><button class="btn danger" onclick="remove(\'notes\',\''+x.id+'\')">✕</button></div>'});list('diaryList',DB.diary,'Записей нет.',function(x){return'<div class="item"><b>'+x.mood+'</b><div>'+esc(x.text)+'</div><button class="btn danger" onclick="remove(\'diary\',\''+x.id+'\')">✕</button></div>'});list('eventsList',DB.events,'Событий нет.',function(x){return'<div class="item"><b>'+esc(x.date)+'</b><div>'+esc(x.title)+'</div><button class="btn danger" onclick="remove(\'events\',\''+x.id+'\')">✕</button></div>'});list('contactsList',DB.contacts,'Контактов нет.',function(x){return'<div class="item"><div>'+esc(x.name)+'<div class="small">'+esc(x.phone)+'</div></div><button class="btn danger" onclick="remove(\'contacts\',\''+x.id+'\')">✕</button></div>'});list('financeList',DB.finance,'Операций нет.',function(x){return'<div class="item"><b>'+ (x.type==='income'?'+':'−')+x.amount.toFixed(2)+'</b><div>'+esc(x.note)+'</div><button class="btn danger" onclick="remove(\'finance\',\''+x.id+'\')">✕</button></div>'});list('bookmarksList',DB.bookmarks,'Закладок нет.',function(x){return'<div class="item"><div><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.title)+'</a><div class="small">'+esc(x.url)+'</div></div><button class="btn danger" onclick="remove(\'bookmarks\',\''+x.id+'\')">✕</button></div>'})}function take(id){var e=document.getElementById(id),v=e.value.trim();e.value='';return v}function addTask(){var v=take('task');if(v)DB.tasks.unshift({id:uid(),text:v,done:false})}function addNote(){var v=take('note');if(v)DB.notes.unshift({id:uid(),text:v})}function addDiary(){var v=take('diaryText');if(v)DB.diary.unshift({id:uid(),mood:document.getElementById('mood').value,text:v})}function addEvent(){var d=take('eventDate'),t=take('eventTitle');if(d&&t)DB.events.unshift({id:uid(),date:d,title:t})}function addContact(){var n=take('contact'),p=take('phone');if(n)DB.contacts.unshift({id:uid(),name:n,phone:p})}function addFinance(){var a=parseFloat(take('amount')),n=take('financeNote');if(a>0)DB.finance.unshift({id:uid(),type:document.getElementById('financeType').value,amount:a,note:n})}function addBookmark(){var t=take('bookmark'),u=take('url');if(t&&u)DB.bookmarks.unshift({id:uid(),title:t,url:u})}['addTask','addNote','addDiary','addEvent','addContact','addFinance','addBookmark'].forEach(function(n){var f=window[n];window[n]=function(){f();save();render()}});function toggleTask(id){DB.tasks.forEach(function(x){if(x.id===id)x.done=!x.done});save();render()}function theme(){DB.theme=DB.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=DB.theme;save()}document.documentElement.dataset.theme=DB.theme;document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('active',v.id===b.dataset.v)});document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x===b)})}});document.querySelector('.nav button').click();document.getElementById('eventDate').value=new Date().toISOString().slice(0,10);var expr='',out='0';function draw(){document.getElementById('expr').textContent=expr||'0';document.getElementById('result').textContent=out}['C','⌫','(',')','7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+'].forEach(function(x){var b=document.createElement('button');b.textContent=x;if(x==='=')b.className='equal';b.onclick=function(){if(x==='C'){expr='';out='0'}else if(x==='⌫')expr=expr.slice(0,-1);else if(x==='='){try{out=/^[0-9+\-*/(). ]+$/.test(expr)?String(Function('return ('+expr+')')()):'Ошибка'}catch(e){out='Ошибка'}}else expr+=x;draw()};document.getElementById('pad').appendChild(b)});draw();render();
</script>
</body>
</html>
